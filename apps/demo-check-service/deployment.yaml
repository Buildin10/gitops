apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-check-service
  labels:
    app: demo-check-service
    app.kubernetes.io/name: demo-check-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-check-service
  template:
    metadata:
      labels:
        app: demo-check-service
        app.kubernetes.io/name: demo-check-service
    spec:
      containers:
        - name: demo-check-service
          image: ghcr.io/buildin10/demo-check-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
