apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-profile-api
  labels:
    app: customer-profile-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: customer-profile-api
  template:
    metadata:
      labels:
        app: customer-profile-api
    spec:
      containers:
        - name: customer-profile-api
          image: ghcr.io/buildin10/customer-profile-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
